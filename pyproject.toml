[project]
name = "us-rental-market-project"
version = "0.1.0"
description = "Look up a rental property address and return its owner, owner type, property manager, management software, and unit count, with evidence and confidence for each field"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
